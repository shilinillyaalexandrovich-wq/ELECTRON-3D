<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07111d"><title>ELECTRON — Карьера начинается здесь</title>
<style>
:root{--cyan:#36d7f4;--gold:#ffca68;--panel:rgba(7,17,29,.88)}*{box-sizing:border-box}body{margin:0;background:#07111d;color:#eef8ff;font-family:Inter,system-ui,Arial;overflow:hidden}#game{display:block;width:100vw;height:100dvh;touch-action:none}.brand{position:fixed;top:18px;left:20px;z-index:2;pointer-events:none}.brand b{font-size:clamp(20px,3vw,30px);letter-spacing:4px;color:var(--cyan)}.brand small{display:block;color:#a9c0d0;letter-spacing:2px;font-size:10px}.hud{position:fixed;top:16px;right:18px;background:var(--panel);border:1px solid #234052;border-radius:16px;padding:12px 16px;min-width:190px;backdrop-filter:blur(10px)}.hud strong{color:var(--gold)}.hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid #315064;border-radius:30px;padding:10px 18px;color:#d8e9f3;font-size:13px;white-space:nowrap}.dialog{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 28px));background:rgba(7,17,29,.97);border:1px solid #3b7188;border-radius:22px;padding:22px;box-shadow:0 20px 80px #0009}.dialog h2{margin:0 0 8px;color:var(--cyan)}.dialog p{color:#c3d4df;line-height:1.5}.choices{display:grid;gap:9px}.choices button,.close{border:1px solid #2b7188;background:#102b3b;color:white;padding:12px;border-radius:12px;font-weight:650;text-align:left}.choices button:hover{background:#17465a}.close{margin-top:12px;text-align:center;width:100%;background:#0d1d2a}.toast{position:fixed;left:50%;top:24%;transform:translateX(-50%);background:#102b3b;border:1px solid var(--cyan);border-radius:12px;padding:12px 18px;display:none;text-align:center}.mobile{position:fixed;bottom:70px;left:18px;width:116px;height:116px;border-radius:50%;border:1px solid #6c9bad66;background:#0b233a88;touch-action:none}.nub{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:#39cce8cc;box-shadow:0 0 22px #36d7f466}.act{position:fixed;right:22px;bottom:88px;border:0;border-radius:50%;width:76px;height:76px;background:linear-gradient(145deg,#40def4,#087da9);color:#03131e;font-weight:900;display:none;box-shadow:0 0 28px #36d7f455}@media(pointer:coarse){.mobile,.act{display:block}.hint{bottom:14px;font-size:11px}}
</style></head><body><canvas id="game"></canvas><div class="brand"><b>ELECTRON</b><small>ТВОЯ КАРЬЕРА В МИРЕ ТЕХНИКИ</small></div><div class="hud"><div>ДЕНЬ <strong id="day">1</strong> · ПРОДАВЕЦ</div><div style="margin-top:7px">Выручка: <strong id="cash">0 ₽</strong></div><div>Продажи: <strong id="sales">0</strong></div><div>Репутация: <strong id="rep">100</strong>%</div></div><div class="hint" id="hint">WASD / стрелки — движение · Подойди к покупателю и нажми E</div><div class="mobile" id="stick"><div class="nub" id="nub"></div></div><button class="act" id="act">E<br>ДИАЛОГ</button><div class="dialog" id="dialog"><h2 id="buyer">Покупатель</h2><p id="need"></p><div class="choices" id="choices"></div><button class="close" id="close">Закрыть</button></div><div class="toast" id="toast"></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,dpr,player={x:0,y:0},keys={},stick={x:0,y:0},cash=0,sales=0,rep=100,active=null,toastTimer=0;
const customers=[{name:'Алексей',x:-3,y:-1.2,need:'Ищу ноутбук для учёбы. Важно уложиться в бюджет 65 000 ₽.',budget:65000,product:'Ноутбук для учёбы',price:59990},{name:'Марина',x:2.8,y:-1.3,need:'Нужен смартфон с хорошей камерой, бюджет до 45 000 ₽.',budget:45000,product:'Смартфон с хорошей камерой',price:39990},{name:'Игорь',x:-4,y:2.3,need:'Подбираю телевизор для гостиной. Хочу большой экран.',budget:80000,product:'Телевизор 55 дюймов',price:69990},{name:'Ольга',x:4.1,y:2.2,need:'Нужны беспроводные наушники для поездок.',budget:18000,product:'Наушники с шумоподавлением',price:14990}];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function round(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function iso(x,y){return {x:W/2+(x-y)*55,y:H/2+(x+y)*27+30}}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1b2c');g.addColorStop(1,'#101d28');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // shop floor
 let corners=[iso(-7,-5),iso(7,-5),iso(7,5),iso(-7,5)];ctx.beginPath();corners.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle='#263746';ctx.fill();ctx.strokeStyle='#456274';ctx.lineWidth=3;ctx.stroke();
 for(let x=-6;x<=6;x+=1)for(let y=-4;y<=4;y+=1){let p=iso(x,y);ctx.strokeStyle='#ffffff0b';ctx.beginPath();ctx.moveTo(p.x,p.y);let q=iso(x+1,y);ctx.lineTo(q.x,q.y);q=iso(x,y+1);ctx.lineTo(q.x,q.y);ctx.stroke()}
 // shelves
 for(let i=-2;i<=2;i++){let p=iso(i*2.2,-3.6);round(p.x-48,p.y-15,96,27,6,'#0b2333');round(p.x-44,p.y-23,88,8,3,'#2dc6e5');for(let k=0;k<3;k++)round(p.x-34+k*28,p.y-42,19,18,3,['#3aa5d1','#e58b55','#6bbd91'][k])}
 let counter=iso(0,-4.6);round(counter.x-145,counter.y-20,290,34,7,'#0c2534');round(counter.x-130,counter.y-25,260,8,3,'#31cbe9');
 // customer sorting
 [...customers,{...player,player:true}].sort((a,b)=>a.x+a.y-(b.x+b.y)).forEach(o=>drawPerson(o));
 requestAnimationFrame(draw)}
function drawPerson(o){let p=iso(o.x,o.y);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(p.x,p.y+9,17,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=o.player?'#19a9d0':['#d78a55','#8c79cf','#61b58a','#d26d83'][customers.indexOf(o)%4];ctx.beginPath();ctx.ellipse(p.x,p.y-12,13,20,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e9b99a';ctx.beginPath();ctx.arc(p.x,p.y-35,10,0,Math.PI*2);ctx.fill();if(!o.player){ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(o.name,p.x,p.y-53);let d=Math.hypot(o.x-player.x,o.y-player.y);if(d<1.5){ctx.strokeStyle='#44e2ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y-15,25,0,Math.PI*2);ctx.stroke()}}}
function move(){let x=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+stick.x,y=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+stick.y;let l=Math.hypot(x,y)||1;player.x=Math.max(-6,Math.min(6,player.x+x/l*.055));player.y=Math.max(-4,Math.min(4,player.y+y/l*.055));let near=nearest();document.getElementById('hint').textContent=near?'Рядом '+near.name+' · нажми E, чтобы помочь':'WASD / стрелки — движение · Найди покупателя';}
function nearest(){return customers.filter(c=>!c.done).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0]||null}
function openBuyer(){let c=nearest();if(!c||Math.hypot(c.x-player.x,c.y-player.y)>1.5){notify('Подойди ближе к покупателю');return}active=c;document.getElementById('buyer').textContent=c.name+' — покупатель';document.getElementById('need').textContent=c.need+'\n\nТвоя задача — подобрать подходящий товар и объяснить выгоду.';let box=document.getElementById('choices');box.innerHTML='';[['Подобрать подходящую модель','good'],['Предложить вариант подешевле','cheap'],['Навязать дорогую модель','bad']].forEach(([label,type])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>sell(type);box.appendChild(b)});document.getElementById('dialog').style.display='block'}
function sell(type){let c=active;if(!c)return;let msg;if(type==='good'){cash+=c.price;sales++;rep=Math.min(100,rep+1);msg='Отлично! Покупатель доволен. Продажа: '+c.price.toLocaleString('ru-RU')+' ₽'}else if(type==='cheap'){cash+=Math.round(c.price*.82);sales++;rep=Math.min(100,rep+2);msg='Покупатель оценил заботу о бюджете. Продажа оформлена.'}else{rep=Math.max(0,rep-12);msg='Покупатель почувствовал давление и ушёл. Репутация снизилась.'}c.done=true;active=null;document.getElementById('dialog').style.display='none';document.getElementById('cash').textContent=cash.toLocaleString('ru-RU')+' ₽';document.getElementById('sales').textContent=sales;document.getElementById('rep').textContent=rep;notify(msg);if(customers.every(x=>x.done)){setTimeout(()=>{customers.forEach((c,i)=>{c.done=false;c.x=[-3,2.8,-4,4.1][i];c.y=[-1.2,-1.3,2.3,2.2][i]});player.x=0;player.y=0;document.getElementById('day').textContent=Number(document.getElementById('day').textContent)+1;notify('Новый день! Покупатели снова в магазине.')},1800)}}
function notify(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',2600)}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.toLowerCase()==='e')openBuyer()});addEventListener('keyup',e=>keys[e.key]=false);document.getElementById('act').onclick=openBuyer;document.getElementById('close').onclick=()=>document.getElementById('dialog').style.display='none';
let stickEl=document.getElementById('stick'),nub=document.getElementById('nub'),pointer=null;stickEl.addEventListener('pointerdown',e=>{pointer=e.pointerId;stickEl.setPointerCapture(pointer);updateStick(e)});stickEl.addEventListener('pointermove',e=>{if(e.pointerId===pointer)updateStick(e)});function updateStick(e){let r=stickEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),m=Math.min(35,len);stick.x=dx/(len||1)*m/35;stick.y=dy/(len||1)*m/35;nub.style.transform='translate('+stick.x*35+'px,'+stick.y*35+'px)'}function resetStick(){pointer=null;stick={x:0,y:0};nub.style.transform=''}stickEl.addEventListener('pointerup',resetStick);stickEl.addEventListener('pointercancel',resetStick);
setInterval(move,16);draw();
</script></body></html>
