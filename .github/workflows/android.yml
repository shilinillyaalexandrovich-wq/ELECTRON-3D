name: Build ELECTRON Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/android-tools.zip
          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" "cmdline-tools;latest" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.3-stable_linux.x86_64
          sudo mv godot-bin/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz -d templates
          cp -r templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configure Godot Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$HOME/android-sdk"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Verify Android toolchain
        run: |
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -f "$HOME/.android/debug.keystore"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed

      - name: Import project
        run: godot --headless --editor --path . --quit --verbose

      - name: Install software-rendered display for scene smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0

      - name: Godot scene startup smoke test (Mesa/OpenGL)
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --quit-after 5 --verbose 2>&1 | tee godot-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-smoke.log; then
            echo "Godot reported a script startup error."
            exit 1
          fi
          ENGINE_ERRORS="$(grep '^ERROR:' godot-smoke.log || true)"
          if [[ -n "$ENGINE_ERRORS" ]]; then
            printf '%s\n' "$ENGINE_ERRORS"
            echo "Godot reported an engine error while running the store scene with Mesa/OpenGL."
            exit 1
          fi
          if ! grep -Eqi "OpenGL API|OpenGL ES" godot-smoke.log; then
            echo "The scene smoke test did not confirm an OpenGL renderer."
            exit 1
          fi

      - name: Export Android APK
        shell: bash
        run: |
          set -o pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --verbose --path . --export-debug "Android" ELECTRON-debug.apk 2>&1 | tee godot-export.log

      - name: Verify Android APK
        shell: bash
        run: |
          set -euo pipefail
          APK="ELECTRON-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$APKSIGNER" verify --verbose "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -Fq "package: name='com.electron.career'" <<< "$BADGING"
          grep -Fq "launchable-activity:" <<< "$BADGING"
          APK_ENTRIES="$(unzip -Z1 "$APK")"
          grep -Fxq "lib/arm64-v8a/libgodot_android.so" <<< "$APK_ENTRIES"
          for required in \
            "assets/project.binary" \
            "assets/scenes/main.tscn.remap" \
            "assets/scripts/game.gdc" \
            "assets/scripts/character_model.gdc" \
            "assets/scripts/customer.gdc"; do
            if ! grep -Fxq "$required" <<< "$APK_ENTRIES"; then
              echo "APK is missing required Godot game payload: $required"
              exit 1
            fi
          done
          echo "Verified Android APK, main store scene, gameplay scripts and ARM64 Godot runtime: $(stat -c%s "$APK") bytes."

      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ELECTRON-build-diagnostics
          path: |
            godot-export.log
            godot-smoke.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ELECTRON-Android-debug
          path: ELECTRON-debug.apk
          if-no-files-found: error
