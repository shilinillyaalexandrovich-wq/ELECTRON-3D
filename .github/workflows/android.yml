name: Build ELECTRON Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.3-stable_linux.x86_64
          sudo mv godot-bin/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz -d templates
          cp -r templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" ELECTRON-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELECTRON-Android-debug
          path: ELECTRON-debug.apk
          if-no-files-found: error
